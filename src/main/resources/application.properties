server.port=8081

# MySQL - change username/password to match your machine
spring.datasource.url=jdbc:mysql://localhost:3306/examsystem?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Tables are created/updated automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Show error messages to the frontend
server.error.include-message=always

# Allowed frontend origin (React dev server). Override when deployed.
exam.cors.origin=http://localhost:5173
